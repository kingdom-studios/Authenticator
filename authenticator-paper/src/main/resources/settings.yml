# !-----------------------------------------------------------------------------------------------!
#                       Welcome to the main configuration of ${project.name}
# !-----------------------------------------------------------------------------------------------!
#
#    This is the main plugin's settings class. You can use SimpleSettings to load values from it,
#    and update it automatically.
#
#    For support and documentation, please visit:
#    - https://github.com/${author}/${project.name}/wiki
#
# !-----------------------------------------------------------------------------------------------!
#
#    1) COLOR CODES are supported with the '&' character.
#       - For usage, see http://minecraftwiki.net/wiki/Formatting_codes
#       - When you use them, place quotes around the message like this: "Hello &cworld."
#       - To use HEX colors, use #123456 syntax: "Hello #123456world."
#
#    2) TO HIDE any message, set it to 'none'.
#
#    3) For UNICODE CHARACTERS (smileys, symbols, ..), save the file in UTF-8 encoding. See
#       - https://github.com/${author}/${project.name}/wiki/Use-Right-Encoding
#
#    4) JSON is supported.
#       - For usage, see https://github.com/${author}/${project.name}/wiki/JSON
#
#    5) WHITELISTS can be turned into blacklists, by putting "@blacklist" on the first line.
#       - Doing such, filters will only apply for messages in those lists.
#
#    PS: Everything above applies for all files in ${project.name}/ folder.
#
# !-----------------------------------------------------------------------------------------------!

# -------------------------------------------------------------------------------------------------
# Unique id of this server in bridge messages and in the node list. Must differ from the proxy's
# node-id and from every other Paper server.
# -------------------------------------------------------------------------------------------------
Node_Id: "paper-1"

# -------------------------------------------------------------------------------------------------
# The shared MariaDB database (10.11 or newer), the same one the proxy uses.
#
# The proxy sits outside the infrastructure and reaches the database on its public address; Paper
# servers sit inside and use the private one. Describe both endpoints here, then pick one with Use.
#
#   Use       - the endpoint tried first. Paper servers normally use "private".
#   Fallback  - endpoints tried, in order, if Use cannot be reached (e.g. [public]). Empty: none.
#               The choice is made at startup; restart after the network is back to return to Use.
#   Ssl_Mode  - disable | trust | verify-ca | verify-full.
#               "disable" is not allowed on the public endpoint, which crosses an untrusted network.
#               trust encrypts but does not check the certificate; verify-full checks chain and host name.
#   Properties - extra driver options. Files must be given as a URI, e.g.
#               serverSslCert: "file:///etc/authenticator/db-ca.pem"   (a bare path does not work)
#
# Paper servers never change the schema: they only check that it is the version this build needs.
# The proxy applies migrations, so start it first after an update.
# -------------------------------------------------------------------------------------------------
Database:
  Use: private
  Fallback: []
  Name: "authenticator"
  Pool_Size: 6
  Connection_Timeout_Ms: 10000
  Endpoints:
    Private:
      Host: "10.0.0.5"
      Port: 3306
      User: "authenticator_backend"
      Password: ""
      Ssl_Mode: disable
      Properties: {}
    Public:
      Host: "db.example.com"
      Port: 3306
      User: "authenticator_backend"
      Password: ""
      Ssl_Mode: verify-full
      Properties: {}

# -------------------------------------------------------------------------------------------------
# The shared Redis that carries messages between the proxy and the servers. The database stays the
# source of truth: if Redis is down, players are still checked against the database, just a little later.
#
# Use, Fallback and the two endpoints work like in Database. The public endpoint must use Ssl: true.
#
#   Secret            - REQUIRED, at least 16 characters, identical on the proxy and on every server.
#                       Every message is signed with it; anything else is ignored.
#   Max_Skew_Seconds  - messages whose time differs from this server's clock by more than this are
#                       dropped, so keep the clocks of all machines synchronized (NTP).
#   Verify_Hostname   - with Ssl, check that the certificate is valid for Host.
#   Ssl_Trust_Store   - PKCS12 (or .jks) file with the certificates to trust, for a server whose
#                       certificate comes from your own CA. Empty: trust what Java trusts.
# -------------------------------------------------------------------------------------------------
Redis:
  Use: private
  Fallback: []
  Prefix: "authenticator:"
  Secret: ""
  Max_Skew_Seconds: 30
  Endpoints:
    Private:
      Host: "10.0.0.6"
      Port: 6379
      User: ""
      Password: ""
      Ssl: false
      Database: 0
      Connect_Timeout_Ms: 5000
    Public:
      Host: "redis.example.com"
      Port: 6379
      User: ""
      Password: ""
      Ssl: true
      Verify_Hostname: true
      Ssl_Trust_Store: ""
      Ssl_Trust_Store_Password: ""
      Database: 0
      Connect_Timeout_Ms: 5000

# -------------------------------------------------------------------------------------------------
# The formats used in the {date}, {date_short}, {date_month} and {location}. 
#
# See the link below to learn how to edit the date format:
# https://docs.oracle.com/javase/8/docs/api/java/text/SimpleDateFormat.html
# -------------------------------------------------------------------------------------------------
Date_Format: "dd.MM.yyyy HH:mm:ss"
Date_Format_Short: "dd.MM.yyyy HH:mm"
Date_Format_Month: "dd.MM HH:mm"
Location_Format: "{world} {x}, {y}, {z}"

# -------------------------------------------------------------------------------------------------
# What commands should trigger the main plugin command group?
#
# * THE FIRST ALIAS IS THE MAIN LABEL, YOU CAN CHANGE IT BUT DO NOT REMOVE IT. *
# * EXAMPLE: [boss, b] will trigger your main command from "/boss" or "/b" * 
# -------------------------------------------------------------------------------------------------
Command_Aliases: [authenticator, auth]

# -------------------------------------------------------------------------------------------------
# What language should we use for messages? If it exists, the language file will be copied 
# to your messages/ folder where you can edit it.
# -------------------------------------------------------------------------------------------------
Locale: en

# -------------------------------------------------------------------------------------------------
# The prefix used in front of most chat or console messages. You can manually use it with
# {plugin_prefix} variable anywhere.
# -------------------------------------------------------------------------------------------------
Prefix: "&8[&c${project.name}&8]&7"

# -------------------------------------------------------------------------------------------------
# Time of some plugin's operations is measured. You can also use the LagCatcher class to invoke
# this feature. We log a console message if an operation takes over the time below (milliseconds). 
# Set to -1 to disable.
# -------------------------------------------------------------------------------------------------
Log_Lag_Over_Milis: 100

# -------------------------------------------------------------------------------------------------
# List of section names that will print informative messages about this plugin's features.
# The Debugger class utilizes this key and will only print messages for sections enabled below.
# -------------------------------------------------------------------------------------------------
Debug: []

# -------------------------------------------------------------------------------------------------
# Do not change this value, otherwise it will corrupt your plugin installation!
# NB: Don't forget to keep this up-to-date with the getConfigVersion method in your Settings class. 
# -------------------------------------------------------------------------------------------------
Version: 1