# Wiadomości dla graczy (MiniMessage; plik w UTF-8). Nadpisujesz je w config.yml, w sekcji "messages".
# Znaczniki w nawiasach ostrych, np. <attempts>, są zastępowane wartością; w opisach komend używamy nawiasów kwadratowych.

# --- po wejściu na serwer ---
prompt.login=<yellow>Zaloguj się: <white>/login [hasło]
prompt.register=<yellow>Zarejestruj się: <white>/register [hasło] [hasło jeszcze raz]
join.premium=<green>Zalogowano automatycznie jako gracz z oryginalnym kontem.
join.session=<green>Witaj z powrotem! Zalogowano automatycznie z Twojego adresu IP.
forced.login=<green>Administrator zalogował Cię na konto.
forced.logout=<yellow>Administrator Cię wylogował. Zaloguj się ponownie: <white>/login [hasło]

# --- komendy ---
login.ok=<green>Zalogowano.
register.ok=<green>Zarejestrowano i zalogowano. Zapamiętaj hasło, nie ma sposobu na jego odzyskanie.
changepassword.ok=<green>Hasło zostało zmienione.
usage.login=<yellow>Użycie: <white>/login [hasło]
usage.register=<yellow>Użycie: <white>/register [hasło] [hasło jeszcze raz]
usage.changepassword=<yellow>Użycie: <white>/changepassword [stare hasło] [nowe hasło]
usage.unregister=<yellow>Użycie: <white>/unregister [hasło]
usage.cracked=<yellow>Użycie: <white>/cracked [nowe hasło] [nowe hasło jeszcze raz]
usage.premium=<yellow>Użycie: <white>/premium

outcome.wrong-password=<red>Błędne hasło. Pozostało prób: <attempts>.
outcome.not-logged-in=<red>Najpierw się zaloguj.
outcome.already-logged-in=<red>Jesteś już zalogowany.
outcome.already-registered=<red>To konto jest już zarejestrowane. Zaloguj się: <white>/login [hasło]
outcome.not-registered=<red>Najpierw się zarejestruj: <white>/register [hasło] [hasło jeszcze raz]
outcome.password-mismatch=<red>Hasła nie są takie same.
outcome.too-many-accounts=<red>Z Twojego adresu IP zarejestrowano już zbyt wiele kont (limit: <limit>).
outcome.name-taken=<red>Ten nick został właśnie zajęty.
outcome.premium-account=<red>To konto jest oryginalne. Ta komenda dotyczy kont z hasłem.
outcome.not-premium-account=<red>To konto ma hasło. Ta komenda dotyczy kont oryginalnych.
outcome.not-original-name=<red>Mojang nie zna oryginalnego konta o tym nicku, więc nie można go przestawić na oryginalne.
outcome.lookup-failed=<red>Nie udało się sprawdzić nicku w serwisach Mojang. Spróbuj za chwilę.
outcome.confirm-required.premium=<yellow>Konto przestanie wymagać hasła, a przy wejściu Mojang będzie potwierdzał, że to Ty. Jeśli Twój klient nie jest oryginalny, nie wejdziesz już na serwer. Aby potwierdzić, wpisz ponownie <white>/premium</white> w ciągu 30 sekund.
outcome.confirm-required.cracked=<yellow>Konto zacznie wymagać hasła, a Mojang przestanie potwierdzać, że to Ty. Aby potwierdzić, wpisz ponownie <white>/cracked [nowe hasło] [hasło jeszcze raz]</white> w ciągu 30 sekund.
outcome.busy=<red>Serwer jest teraz zajęty. Spróbuj za chwilę.
outcome.conflict=<red>Konto zmieniło się w trakcie komendy. Spróbuj jeszcze raz.
outcome.error=<red>Coś poszło nie tak. Spróbuj za chwilę lub zgłoś się do administracji.

weak.too-short=<red>Hasło jest za krótkie (minimum <min> znaków).
weak.too-long=<red>Hasło jest za długie (maksimum 72 bajty).
weak.whitespace=<red>Hasło nie może zawierać spacji.
weak.same-as-name=<red>Hasło nie może być takie samo jak nick.
weak.forbidden=<red>To hasło jest zbyt popularne. Wybierz inne.

# --- wyrzucenie z serwera ---
kick.timeout=<red>Nie zalogowano w wyznaczonym czasie.
kick.too-many-attempts=<red>Zbyt wiele błędnych haseł.
kick.ip-blocked=<red>Z Twojego adresu IP było zbyt wiele błędnych haseł. Blokada trwa do <until>.
kick.reconnect.premium=<green>Gotowe. To konto jest teraz oryginalne. Wejdź ponownie na serwer.
kick.reconnect.cracked=<green>Gotowe. To konto ma teraz hasło. Wejdź ponownie na serwer i zaloguj się: <white>/login [hasło]
kick.unregistered=<yellow>Konto zostało usunięte. Wejdź ponownie, aby założyć nowe.
kick.type-changed=<yellow>Typ Twojego konta został zmieniony przez administratora. Wejdź ponownie na serwer.
kick.no-server=<red>Serwer logowania jest teraz niedostępny. Spróbuj za chwilę.

# --- odmowa wejścia ---
deny.too-many-connections=<red>Zbyt wiele połączeń z Twojego adresu IP. Spróbuj za chwilę.
deny.bad-nickname=<red>Ten nick jest niedozwolony. Dozwolone są litery, cyfry i znak podkreślenia (3-16 znaków).
deny.ip-blocked=<red>Z Twojego adresu IP było zbyt wiele błędnych haseł. Blokada trwa do <until>.
deny.already-online=<red>Gracz o tym nicku jest już na serwerze.
deny.wrong-case=<red>Wejdź z nickiem zapisanym dokładnie tak: <white><name></white>
deny.premium-lookup-failed=<red>Nie udało się sprawdzić nicku w serwisach Mojang. Spróbuj za chwilę.
deny.database-error=<red>Nie można teraz zweryfikować Twojego konta. Spróbuj za chwilę.

open.database-error=<red>Nie można teraz zweryfikować Twojego konta. Spróbuj za chwilę.
open.name-owned-by-other=<red>Ten nick należy do innego oryginalnego konta.
open.account-type-mismatch=<red>Ten nick jest zarejestrowany z innym typem konta. Wejdź tak, jak ostatnio, albo użyj komendy /premium lub /cracked.
open.rename-conflict=<red>Twoje oryginalne konto zmieniło nick na taki, który jest już zarejestrowany. Skontaktuj się z administracją.
open.unverified-profile=<red>Nie można potwierdzić Twojego konta. Wejdź ponownie.
